<html lang="en">
<head>
<meta charset="utf-8">

   With null, the game still works in one-screen mode.

</script>
<style>
:root {
  --indigo: #1E2A5A; --indigo2: #25336B; --indigo3: #2F3F7E; --sea: #22306A;
  --cotton: #E4D9BF; --text: #ECE4D0; --text2: rgba(236, 228, 208, .74); --line: rgba(236, 228, 208, .17);
  --paper: #F3ECDD; --paper2: #E8DEC8; --ink: #221F1A; --ink2: #5B5345;
  --glass: #9ED9CF; --glassInk: #0E2B30; --madder: #A33B2C; --leaf: #2E7349;
  --serif: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Alegreya Sans", "Gill Sans", "Gill Sans MT", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--indigo); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0 0 .6em; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px; }
.card :focus-visible { outline-color: #2D5C8F; }

/* ---------- Buttons & fields ---------- */
.btn { font-weight: 700; background: var(--glass); color: var(--glassInk); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; line-height: 1.2; }
.btn:hover:not(:disabled) { background: #B6E5DD; }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px rgba(236, 228, 208, .42); }
.btn.ghost:hover:not(:disabled) { background: rgba(236, 228, 208, .08); }
.btn.link { background: none; color: var(--glass); padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.btn.ink { background: var(--ink); color: var(--paper); margin-top: 6px; }
.btn.ink:hover { background: #3A352D; }
.btn.sm { padding: 6px 10px; font-size: 14px; }
.btn.link.sm { padding: 2px 0; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.asLink { background: none; border: 0; padding: 0; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--text2); }
.field.grow { flex: 1; }
input, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid #CDBE97; border-radius: 5px; padding: 9px 10px; min-width: 0; }
#code { width: 8.5ch; text-transform: uppercase; letter-spacing: .16em; font-weight: 700; }
.hint { color: var(--text2); font-size: 14.5px; }
.hint.ink, .card .hint { color: var(--ink2); }
.note { background: rgba(158, 217, 207, .1); border-left: 3px solid var(--glass); padding: 10px 12px; font-size: 15px; }
.waiting { color: var(--text2); font-style: italic; }
.card .waiting { color: var(--ink2); }
.empty { color: var(--text2); font-size: 14.5px; }

/* ---------- Chips ---------- */
.chip { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #14193A; font-weight: 800; font-size: 12px; flex: none; box-shadow: 0 0 0 1px rgba(14, 21, 51, .5); }
.chip.blank { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(236, 228, 208, .4); }
.chip.lg { width: 42px; height: 42px; font-size: 19px; }
.chip.sm { width: 18px; height: 18px; font-size: 10px; margin-right: 6px; vertical-align: -3px; display: inline-grid; }

/* ---------- Top bar ---------- */
.bar { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.wordmark { font-family: var(--serif); font-size: 25px; color: var(--text); }
.round { font-weight: 700; }
.room { color: var(--text2); }
.room b { color: var(--text); letter-spacing: .14em; }
.barBtns { margin-left: auto; display: flex; gap: 8px; }

/* ---------- Map ---------- */
.map { display: block; width: 100%; height: auto; }
.sea { fill: var(--sea); }
.rhumb line { stroke: var(--cotton); stroke-width: .5; }
.rhumb .rh1 { stroke-opacity: .13; }
.rhumb .rh2 { stroke-opacity: .06; }
.rose circle { fill: none; stroke: rgba(228, 217, 191, .35); stroke-width: .7; }
.rose polygon { fill: rgba(228, 217, 191, .2); stroke: rgba(228, 217, 191, .45); stroke-width: .5; }
.land path { stroke: #B3A277; stroke-width: .7; stroke-linejoin: round; }
.lakes path { fill: var(--sea); stroke: #B3A277; stroke-width: .6; }
.ocean { font-family: var(--serif); font-style: italic; font-size: 13px; fill: rgba(228, 217, 191, .45); letter-spacing: .05em; }
.ocean.small { font-size: 9.5px; }
.route { fill: none; stroke-width: 1.1; }
.route.sea { stroke: rgba(228, 217, 191, .42); stroke-dasharray: 5 3.5; }
.route.forced { stroke: #E08B7A; stroke-dasharray: 1.6 3; stroke-width: 1.7; stroke-linecap: round; }
.route.land { stroke: #7C6A44; stroke-dasharray: 1 2.8; stroke-width: 1.4; stroke-linecap: round; }
.routeLab { font-family: var(--serif); font-style: italic; font-size: 9.5px; fill: rgba(228, 217, 191, .75); }
.routeLab.forced { fill: #F2AE9F; }
.routeLab.land { fill: #6B5A37; }
.city { fill: #5B4E33; }
.cityLab { font-size: 8.5px; fill: #4B412B; font-weight: 700; }
.mLab { font-size: 10px; font-weight: 800; fill: #F3ECDD; paint-order: stroke; stroke: #19234C; stroke-width: 2.8px; stroke-linejoin: round; pointer-events: none; }
.frame { fill: none; stroke: rgba(228, 217, 191, .3); }
.mk { cursor: pointer; outline: none; }
.mk .hit { fill: transparent; }
.mk .dot { fill: #16214A; stroke: var(--cotton); stroke-width: 1.3; }
.mk.owned .dot { stroke: #0E1533; stroke-width: 1.4; }
.mk:hover .dot { stroke: #fff; }
.mk:focus-visible .dot { stroke: var(--glass); stroke-width: 2.6; }
.gly { color: var(--cotton); fill: var(--cotton); }
.mk .ini { font-size: 10.5px; font-weight: 800; fill: #14193A; pointer-events: none; }
.mk .cap { fill: none; stroke-width: 1.7; }
.mk .tRing { fill: none; stroke: var(--glass); stroke-width: 1.9; stroke-dasharray: 3 2.2; }
.mk .sRing { fill: none; stroke: #fff; stroke-width: 2; }
.lgDot { fill: #16214A; stroke: var(--cotton); stroke-width: 1; }
.mapFrame { border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(228, 217, 191, .25), 0 10px 30px rgba(8, 12, 30, .35); background: var(--sea); }
.mapScroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text2); margin: 10px 2px 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Home ---------- */
.home { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; background: var(--sea); }
.homeMap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.homeMap .map { width: max(100vw, 1100px); flex: none; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); }
.homeMap .frame { display: none; }
.homeCard { position: relative; width: 100%; max-width: 600px; background: rgba(22, 31, 72, .9); padding: 34px 36px 28px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(228, 217, 191, .22), 0 30px 80px rgba(6, 10, 28, .6); }
.title { font-family: var(--serif); font-weight: 400; font-size: clamp(54px, 10vw, 88px); line-height: .92; letter-spacing: -.01em; }
.sub { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--text2); margin: 10px 0 14px; line-height: 1.35; }
.lede { font-size: 16.5px; max-width: 52ch; }
.homeGroup { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.homeGroup h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; margin-bottom: 10px; }
.homeGroup .field { margin-bottom: 6px; }
.homeActions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 10px; }
.joinRow { display: inline-flex; gap: 8px; }
.or { color: var(--text2); font-style: italic; }

/* ---------- Pages ---------- */
.page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 48px; }
.page.narrow { max-width: 720px; }
.page h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 24px 0 12px; }
.pageTitle { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1.05; margin-bottom: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
.seg { border: 0; padding: 0; margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.seg legend { font-size: 14px; color: var(--text2); margin-bottom: 6px; padding: 0; }
.seg.inline { margin: 0 0 14px; }
.segBtn { background: transparent; color: var(--text); border: 1px solid rgba(236, 228, 208, .35); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 700; display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
.segBtn small { font-weight: 400; color: var(--text2); font-size: 13px; }
.segBtn.on { background: var(--glass); color: var(--glassInk); border-color: var(--glass); }
.segBtn.on small { color: var(--glassInk); }
.setupRows { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.setupRow { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.setupRow .chip { margin-bottom: 8px; }
.powersRef { margin-top: 22px; }
.powersRef summary { cursor: pointer; color: var(--glass); font-weight: 700; }
.powerRef { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 20px; margin-top: 12px; }
.powerRef b { display: inline-flex; align-items: center; }
.powerRef p { font-size: 14.5px; color: var(--text2); margin: 4px 0 0; }

/* ---------- Lobby ---------- */
.lobbyTop { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start; }
.lobbyTop h2 { margin-top: 0; }
.roomBig { background: var(--paper); color: var(--ink); padding: 16px 20px; border-radius: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.roomBig span { font-size: 14px; color: var(--ink2); }
.roomBig b { font-size: 50px; letter-spacing: .16em; line-height: 1; font-weight: 800; }
.roomBig .btn.ghost { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(34, 31, 26, .35); margin-top: 6px; }
.plist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.plist li { display: flex; align-items: center; gap: 10px; }
.pname em { font-style: normal; font-size: 12.5px; background: rgba(236, 228, 208, .14); padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
.pstat { color: var(--text2); margin-left: auto; font-size: 14.5px; }
.away { font-size: 12.5px; color: #F2AE9F; }
.powerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.powerTile { text-align: left; background: var(--indigo2); border: 1px solid var(--line); border-top: 4px solid var(--c); color: var(--text); padding: 14px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.powerTile:hover:not(:disabled) { background: var(--indigo3); }
.powerTile.on { background: var(--indigo3); box-shadow: inset 0 0 0 2px var(--glass); }
.powerTile:disabled { opacity: .5; cursor: not-allowed; }
.ptHead { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.taken { margin-left: auto; font-size: 13px; color: var(--text2); }
.ptAbility { font-family: var(--serif); font-style: italic; font-size: 16px; }
.ptText, .ptStart { font-size: 14px; color: var(--text2); }
.waiting.hint { margin-top: 20px; }

/* ---------- Game board ---------- */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 22px; padding: 16px 20px 40px; max-width: 1560px; margin: 0 auto; align-items: start; }
.rail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 4px; }
.ledgers { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.ledger { background: var(--indigo2); border-left: 4px solid var(--c); padding: 10px 12px; border-radius: 2px 6px 6px 2px; }
.ledger.now { background: var(--indigo3); box-shadow: inset 0 0 0 1px rgba(158, 217, 207, .55); }
.lgTop { display: flex; align-items: center; gap: 10px; }
.lgName { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.lgName b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lgName span { font-size: 13px; color: var(--text2); }
.prest { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.prest b { font-family: var(--serif); font-size: 28px; font-weight: 400; }
.prest span { font-size: 11.5px; color: var(--text2); }
.lgStats { display: flex; gap: 12px; font-size: 14px; color: var(--text2); margin-top: 8px; flex-wrap: wrap; }
.lgStats b { color: var(--text); }
.lgTech { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.lgTech span { font-size: 12px; background: rgba(236, 228, 208, .1); padding: 1px 7px; border-radius: 3px; }
.lgTech .none { background: none; padding: 0; color: var(--text2); }
.lgAway { font-size: 13px; color: #F2AE9F; margin-top: 6px; }
.log { margin-top: 14px; font-size: 14px; }
.log summary { cursor: pointer; color: var(--text2); }
.log ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }
.lr { display: inline-block; min-width: 2.4em; color: var(--text2); font-size: 12px; }

.turn { background: var(--indigo2); border-radius: 8px; padding: 16px; box-shadow: inset 0 0 0 1px var(--line); }
.tHead { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.tHead h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.05; }
.tHead p { margin: 0; color: var(--text2); font-size: 14.5px; }
.revenue { font-size: 14.5px; }
.lastMove { font-size: 14px; color: var(--text2); display: flex; align-items: center; }
.step { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 12px 0 10px; }
.qPick { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.qBtn { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "n p" "d p"; text-align: left; gap: 2px 12px; background: var(--paper); color: var(--ink); border: 0; border-radius: 5px; padding: 11px 14px; cursor: pointer; }
.qBtn:hover { background: #FFF8EA; }
.qName { grid-area: n; font-weight: 800; font-size: 17px; }
.qDesc { grid-area: d; font-size: 14px; color: var(--ink2); }
.qPay { grid-area: p; align-self: center; font-family: var(--serif); font-size: 20px; }

/* Paper cards */
.card { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 16px 18px; box-shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 10px 26px rgba(8, 12, 30, .35); }
.qMeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13px; color: var(--ink2); margin-bottom: 10px; }
.qMeta span:first-child { font-weight: 700; color: var(--ink); }
.stim { margin: 0 0 12px; padding: 10px 12px; border-left: 3px solid #B9A57A; background: var(--paper2); }
.stim figcaption { font-size: 12.5px; color: var(--ink2); font-style: italic; margin-bottom: 4px; }
.stim p { font-family: var(--serif); font-size: 17px; line-height: 1.5; margin: 0; }
.qText { font-weight: 700; font-size: 17px; line-height: 1.4; }
.opts { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 7px; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: #FBF6EA; color: var(--ink); border: 1px solid #D8CCB2; border-radius: 4px; padding: 9px 11px; cursor: pointer; flex-wrap: wrap; }
.opt:hover:not(:disabled) { border-color: #8F7E57; background: #fff; }
.opt:disabled { cursor: default; }
.let { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--paper2); }
.otx { flex: 1; min-width: 0; padding-top: 1px; }
.opt.right { border-color: var(--leaf); background: #E2EDDC; }
.opt.right .let { background: var(--leaf); color: #fff; }
.opt.wrong { border-color: var(--madder); background: #F5E0D8; }
.opt.wrong .let { background: var(--madder); color: #fff; }
.opt.guessed { border-color: #2D5C8F; box-shadow: inset 0 0 0 1px #2D5C8F; }
.mark { flex-basis: 100%; padding-left: 34px; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.result { margin-top: 12px; border-top: 1px solid #D8CCB2; padding-top: 10px; }
.verdict { font-weight: 800; font-size: 16.5px; }
.result.ok .verdict { color: var(--leaf); }
.result.no .verdict { color: var(--madder); }
.why { font-size: 15.5px; }
.ansLine { font-size: 15.5px; }
.guessNote { font-size: 14px; color: var(--ink2); }

.moveGroup { margin-top: 14px; }
.moveGroup h4 { font-size: 14.5px; color: var(--text2); font-weight: 700; margin-bottom: 6px; }
.mList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mRow, .tRow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--indigo3); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; }
.mRow:hover, .tRow:hover:not(:disabled) { border-color: var(--glass); }
.tRow:disabled { opacity: .5; cursor: not-allowed; }
.mName { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.3; }
.mName span { font-size: 13.5px; color: var(--text2); }
.mName .origin { font-style: italic; font-size: 12.5px; }
.mCost { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; color: var(--text2); line-height: 1.1; flex: none; }
.mCost b { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--text); }
.mGly { flex: none; display: grid; }
.mList.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mList.grid .mRow { padding: 7px 8px; gap: 7px; height: 100%; }
.mList.grid .mName b { font-size: 14.5px; }
.mList.grid .mName span { font-size: 12.5px; }
.mList .rg { grid-column: 1 / -1; font-size: 12.5px; color: var(--text2); margin-top: 4px; }
.mList .rg:first-child { margin-top: 0; }
.moveGroup + .moveGroup { margin-top: 16px; }
.qCard.revealed .result { margin: 0 0 14px; border-top: 0; border-bottom: 1px solid #D8CCB2; padding: 0 0 12px; }
.qCard.revealed .btn.ink { margin: 0 0 14px; }
.mapHint { display: none; font-size: 13px; color: var(--text2); margin: 6px 2px 0; }

.evCard h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.05; }
.evRound { font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.evDate { font-family: var(--serif); font-style: italic; color: var(--ink2); font-size: 17px; }
.evBlurb { font-size: 16px; }
.evEffect { background: var(--paper2); padding: 8px 10px; border-radius: 3px; font-size: 15px; }
.evResults { padding-left: 1.1em; margin: 8px 0 12px; font-size: 15px; }

.mPanel { background: var(--indigo2); border-radius: 8px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.mpHead { display: flex; align-items: baseline; gap: 10px; }
.mpHead h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; }
.mpHead .btn { margin-left: auto; }
.mpSub { font-size: 14px; color: var(--text2); margin-top: 2px; }
.mpOwner { font-size: 15px; display: flex; align-items: center; }
.mpNote { font-size: 15px; }

/* ---------- Game over ---------- */
.tableWrap { overflow-x: auto; margin-top: 16px; }
table.final { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 15px; }
.final th { text-align: right; font-weight: 700; color: var(--text2); font-size: 13.5px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.final th:nth-child(-n+2) { text-align: left; }
.final td { padding: 10px; text-align: right; border-bottom: 1px solid var(--line); }
.final td:first-child { text-align: left; color: var(--text2); width: 2em; }
.final td:nth-child(2) { text-align: left; }
.final .who { display: flex; gap: 10px; align-items: center; }
.final .who > span { display: flex; flex-direction: column; line-height: 1.2; }
.final .who > span span { font-size: 13px; color: var(--text2); }
.overSub { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--text2); margin-bottom: 4px; }
.final .tot { font-family: var(--serif); font-size: 26px; }
.final tr.win td { background: rgba(158, 217, 207, .08); }
.mapFrame.small { margin-top: 24px; }
.review { margin-top: 12px; }
.acc { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 8px; }
.acc b { font-family: var(--serif); font-weight: 400; font-size: 24px; }
.rvList { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.rvStim { font-family: var(--serif); font-size: 15.5px; background: var(--paper2); padding: 8px 10px; border-left: 3px solid #B9A57A; }
.rvA { color: var(--leaf); }
.rvYou { color: var(--madder); }

/* ---------- Modal & toast ---------- */
#modal .scrim { position: fixed; inset: 0; background: rgba(10, 14, 35, .62); z-index: 20; }
#modal .sheet { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(680px, calc(100vw - 24px)); max-height: 86vh; overflow: auto; background: var(--indigo2); border-radius: 8px; padding: 20px 24px 24px; box-shadow: 0 0 0 1px rgba(228, 217, 191, .25), 0 30px 80px rgba(0, 0, 0, .5); }
.sheetHead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.sheetHead h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; }
.sheetHead .btn { margin-left: auto; }
.rules h3 { font-family: var(--serif); font-weight: 400; font-size: 20px; margin: 18px 0 6px; }
.rules ol, .rules ul { padding-left: 1.2em; margin: 0 0 10px; }
.rules li { margin-bottom: 5px; }
.menuList { display: flex; flex-direction: column; gap: 10px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 6px; font-weight: 700; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 30; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsive ---------- */
@media (max-width: 1020px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; order: -1; }
}
@media (max-width: 720px) {
  .mapScroll .map { min-width: 700px; }
  .mapHint { display: block; }
  .bar { padding: 8px 14px; gap: 10px; }
  .wordmark { font-size: 21px; }
  .homeCard { padding: 26px 20px 22px; }
  .lobbyTop { grid-template-columns: 1fr; gap: 18px; }
  .board { padding: 12px 12px 32px; }
}
@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
}

{id:"r24",t:"recall",topic:4,q:"What was a hacienda?",

 why:"Haciendas focused on producing goods for profit, while the encomienda focused on controlling Indigenous people and their labor."},
{id:"r25",t:"recall",topic:4,q:"What is indentured servitude?",
 o:["A contract to work for several years, often seven, in exchange for passage to the colonies","Lifelong slavery passed down to children","A Spanish labor draft for silver mines","Service in a ruler’s army in exchange for land"],
 why:"Many poor Europeans, especially in English colonies, signed indentures to pay for their passage and went free when the contract ended."},
{id:"r26",t:"recall",topic:4,q:"What was new about chattel slavery in the Americas?",
 o:["It was race-based and hereditary","It was the first slavery that had ever existed","Enslaved people could easily buy their freedom","It lasted only a set number of years"],
 why:"Slavery existed long before 1450, but in the Americas it became tied to African ancestry, and the children of enslaved mothers were born enslaved."},
{id:"r27",t:"recall",topic:4,q:"What happened to the Gujarati merchants of the Mughal Empire as Europeans entered the Indian Ocean?",
 o:["They kept trading, and many grew richer","They were driven out of business entirely","They moved their trade to the Atlantic","They became sailors in the Portuguese navy"],
 why:"Long-established Asian merchants kept using the Indian Ocean network, and European demand increased many of their profits. That is an important continuity."},
{id:"r28",t:"recall",topic:4,q:"How did Tokugawa Japan respond to European missionaries?",
 o:["It expelled them and suppressed Christianity","It made Christianity the state religion","It put them in charge of government schools","It ignored them completely"],
 why:"The shogun saw Christian conversion as a threat to Japan’s newly won unity, so he expelled missionaries and suppressed the faith, often violently."},
{id:"r29",t:"recall",topic:4,q:"How did the Asante Empire grow powerful?",
 o:["By trading gold, ivory, and enslaved captives to Europeans and using the wealth to build its military","By conquering Portugal’s colonies in Brazil","By refusing all trade with Europeans","By mining silver for the Spanish"],
 why:"Trade with the Portuguese and later the British made the Asante rich, and they used that wealth to expand their army and consolidate power."},
{id:"r30",t:"recall",topic:4,q:"Why did the king of Kongo convert to Christianity?",
 o:["To strengthen diplomatic and trade ties with Portugal","Because Portugal had conquered Kongo","To end the trans-Saharan trade","To join the Ottoman Empire"],
 why:"Kongo’s rulers adopted Christianity to deepen their partnership with Portugal. The relationship enriched Kongo before it soured over the slave trade."},
{id:"r31",t:"recall",topic:5,q:"What is mercantilism?",
 o:["An economic policy in which the state builds wealth in gold and silver by exporting more than it imports","A system in which governments stay out of trade","Trading goods without using money","A religious rule against charging interest"],
 why:"Mercantilists saw wealth as a fixed pie measured in bullion, so they pursued a favorable balance of trade and colonies that bought their exports."},
{id:"r32",t:"recall",topic:5,q:"What is a joint-stock company?",
 o:["A business funded by many investors, each of whom could lose only what they invested","A company owned entirely by a king","A guild of craftsmen who shared their tools","A bank run by the Catholic Church"],
 why:"Investors shared the risk and the profits. States often chartered these companies and granted them trade monopolies."},
{id:"r33",t:"recall",topic:5,q:"Which joint-stock company was chartered in 1602 with a monopoly on Dutch trade in Asia?",
 o:["The Dutch East India Company (VOC)","The British East India Company","The Hudson’s Bay Company","The Royal African Company"],
 why:"The VOC pushed the Portuguese out of much of the Indian Ocean spice trade, made its investors rich, and extended Dutch power."},
{id:"r34",t:"recall",topic:5,q:"Where was the great silver mine of Potosí?",
 o:["In the Andes, in today’s Bolivia","In central Mexico","On the Gold Coast of West Africa","In southern Japan"],
 why:"Potosí was the largest source of silver in the world, and much of its silver ended up in China."},
{id:"r35",t:"recall",topic:5,q:"What are creole languages?",
 o:["New languages that blend European, African, and sometimes Indigenous languages","Languages spoken only by Spanish nobles","Secret codes used by pirates","The official languages of the Inca empire"],
 why:"Enslaved Africans from many language groups developed creole languages within about a generation, an example of cultural synthesis."},
{id:"r36",t:"recall",topic:5,q:"Who was Bartolomé de las Casas?",
 o:["A Dominican priest who protested Spanish abuse of Indigenous people","A conquistador who defeated the Inca","The Portuguese captain who reached Brazil","A Spanish monarch who expelled the Jews"],
 why:"Las Casas’s protests helped produce laws outlawing the enslavement of Indigenous Americans and limiting the forced labor they could be made to do."},
{id:"r37",t:"recall",topic:6,q:"What was the Fronde?",
 o:["A revolt in France against new taxes and growing royal power","A Spanish colony in North America","A Dutch warship design","The treaty that ended the Thirty Years’ War"],
 why:"Nobles led the Fronde (1648–1653) as royal power grew. It was crushed, and the French monarchy came out stronger."},
{id:"r38",t:"recall",topic:6,q:"Who was Queen Nzinga?",
 o:["A ruler of Ndongo and Matamba who resisted the Portuguese","A Mughal empress who governed Surat","An Asante queen who traded with the British","A queen of Kongo who converted to Islam"],
 why:"Nzinga allied with the Dutch and with Kongo and fought Portuguese encroachment in west-central Africa for decades."},
{id:"r39",t:"recall",topic:6,q:"Who led the Pueblo Revolt of 1680?",
 o:["Popé","Túpac Amaru","Queen Nanny","Osei Tutu"],
 why:"Popé organized Pueblo communities against Spanish forced labor and missionary abuses. They drove the Spanish out of New Mexico for about a decade."},
{id:"r40",t:"recall",topic:6,q:"What were Maroon communities?",
 o:["Free communities formed by people who escaped slavery","Plantations owned by free Black families","Dutch trading posts in Brazil","Spanish missions in the Caribbean"],
 why:"Maroons lived in hard-to-reach places like the mountains of Jamaica. Jamaica’s Maroons fought the British until treaties recognized their freedom."},
{id:"r41",t:"recall",topic:6,q:"What happened in the Stono Rebellion of 1739?",
 o:["Enslaved people in South Carolina seized weapons and rose against their enslavers","Pueblo people drove the Spanish out of New Mexico","French nobles revolted against new taxes","Japanese Christians rebelled against the shogun"],
 why:"The local militia crushed the rebellion, but it terrified slaveholding colonies, which passed harsher laws."},
{id:"r42",t:"recall",topic:7,q:"What did Spain do to its Jewish population in 1492, after completing the Reconquista?",
 o:["Ordered all Jews who would not convert to leave","Made Judaism an official religion","Sent them to found colonies in the Americas","Gave them control of Seville’s trade"],
 why:"Spain’s monarchs ordered Jews to convert or leave. Portugal soon did the same, while the Ottoman Empire took in many of the refugees."},
{id:"r43",t:"recall",topic:7,q:"Which state welcomed many of the Jews expelled from Spain?",
 o:["The Ottoman Empire","France","Ming China","The Inca Empire"],
 why:"The Ottomans offered relative tolerance. Jews could prosper in trade and even rise at court, though as non-Muslims they paid the jizya tax."},
{id:"r44",t:"recall",topic:7,q:"How did the Qing dynasty treat China’s Han majority?",
 o:["It reserved top offices for Manchus and required Han men to wear the Manchu queue","It banned Han people from taking the civil service exam","It made Han Chinese the ruling elite","It forced Han people to convert to Christianity"],
 why:"The Manchu kept the civil service exam but gave the highest posts to Manchus. The required queue hairstyle was a daily reminder of foreign rule."},
{id:"r45",t:"recall",topic:7,q:"In the Spanish casta system, who were peninsulares?",
 o:["People born in Spain or Portugal","People of European descent born in the Americas","People of mixed European and Indigenous ancestry","Enslaved Africans"],
 why:"Peninsulares, born on the Iberian Peninsula, sat at the top. Creoles, of European descent but born in the Americas, ranked just below them."},
{id:"r46",t:"recall",topic:7,q:"In the casta system, a mestizo was a person of:",
 o:["European and Indigenous ancestry","European and African ancestry","African and Indigenous ancestry","Spanish birth living in the Americas"],
 why:"Mestizos had European and Indigenous ancestry, mulattoes European and African, and zambos African and Indigenous."},
{id:"r47",t:"recall",topic:7,q:"How did Peter the Great weaken Russia’s boyars?",
 o:["He took away their rank and tied status to service to the state","He gave them command of the army","He let them elect the czar","He exiled every one of them to Siberia"],
 why:"Peter centralized power, crushed boyar resistance, and made government positions depend on serving the state directly."},
{id:"r48",t:"recall",topic:7,q:"What happened to Ottoman timars, the land grants given for military service?",
 o:["Sultans increasingly turned them into tax farms that sent revenue to the state","They were given to Jewish merchants","They became independent kingdoms","They were sold to European trading companies"],
 why:"As timar holders died, sultans converted the grants into tax farms, leaving the old landed elite with less land and less power."},
{id:"r49",t:"recall",topic:7,q:"Which Mughal emperor was known for religious tolerance and for ending the jizya tax?",
 o:["Akbar","Aurangzeb","Babur","Shah Jahan"],
 why:"Akbar ended the jizya and funded places of worship for several faiths. A later emperor, Aurangzeb, brought the tax back."},
{id:"r50",t:"recall",topic:4,q:"Where did Spain set up its main base in Asia?",
 o:["The Philippines","Malacca","Ceylon","Macau"],
 why:"Spain ran the Philippines, centered on Manila, as a full colony, using the same tribute and coerced labor it used in the Americas."},
{id:"r51",t:"recall",topic:4,q:"Why did the British hold only coastal trading posts in India before 1750?",
 o:["The Mughal Empire was too strong for them to conquer","Britain had no interest in Indian goods","The Portuguese controlled all of India","India had no usable ports"],
 why:"Britain wanted India but lacked the military power to take it from the Mughals, so it settled for coastal posts. It moved toward colonial rule later in the 1700s."},
{id:"r52",t:"recall",topic:4,q:"Over roughly 350 years, about how many enslaved Africans were forced onto ships bound for the Americas?",
 o:["About 12.5 million","About 1.25 million","About 125,000","About 50 million"],
 why:"The trans-Atlantic slave trade was far larger than the earlier Mediterranean and Indian Ocean slave trades."},
{id:"r53",t:"recall",topic:5,q:"What was the Middle Passage?",
 o:["The forced voyage of enslaved Africans across the Atlantic","The galleon route from Acapulco to Manila","A shipping lane through the Strait of Malacca","The overland Silk Road through Central Asia"],
 why:"The Middle Passage was the deadly Atlantic crossing, one leg of the Atlantic system of trade."},
{id:"r54",t:"recall",topic:5,q:"Which crop dominated Caribbean plantations?",
 o:["Sugarcane","Cotton","Tea","Wheat"],
 why:"Caribbean colonies specialized in sugarcane, grown and processed by enslaved Africans. As supply rose, sugar prices fell and European demand soared."},
{id:"r55",t:"recall",topic:4,q:"How did Ming China respond to Portuguese traders in the early 1500s?",
 o:["Officials expelled them after learning they had used bribery","The emperor gave them control of Canton","China sent a fleet to attack Lisbon","Ming merchants joined the Portuguese navy"],
 why:"Ming policies kept tight state control over sea trade. The expulsion further isolated China from growing European power at sea."},
{id:"r56",t:"recall",topic:5,q:"What does syncretism mean?",
 o:["Blending different religious or cultural traditions into something new","Forcing a population to convert","Translating the Bible into local languages","Trading religious objects for silver"],
 why:"Examples include the Virgin of Guadalupe in Mexico and Vodun in the Caribbean, which blended Christianity with Indigenous or African beliefs."},

{id:"s03",t:"stimulus",topic:5,s:"Silver mined at Potosí was shipped to Spain on treasure fleets. Much of it also crossed the Pacific on galleons from Acapulco to Manila, where it bought Chinese silk and porcelain. Ming China had begun requiring that taxes be paid in silver.",

{id:"s04",t:"stimulus",topic:5,s:"Silver mined at Potosí was shipped to Spain on treasure fleets. Much of it also crossed the Pacific on galleons from Acapulco to Manila, where it bought Chinese silk and porcelain. Ming China had begun requiring that taxes be paid in silver.",
 q:"A mercantilist official in Spain would most likely view the silver flowing to Manila as:",
 o:["A drain on Spain’s wealth that should be limited","A healthy sign of a favorable balance of trade","Unimportant, since mercantilists measured wealth in land","A useful way to spread Christianity in China"],

{id:"s05",t:"stimulus",topic:5,s:"In 1602 the Dutch government granted the United East India Company the sole right to Dutch trade east of the Cape of Good Hope. The charter let the company build forts, keep soldiers, and make treaties with Asian rulers. Shares were sold to investors across the Netherlands.",

{id:"s06",t:"stimulus",topic:4,s:"Edicts issued in the 1630s forbade Japanese people from traveling abroad, expelled the Portuguese, and banned Christianity. Dutch merchants were allowed to stay but were confined to the small island of Dejima in Nagasaki harbor.",

{id:"s07",t:"stimulus",topic:4,s:"Edicts issued in the 1630s forbade Japanese people from traveling abroad, expelled the Portuguese, and banned Christianity. Dutch merchants were allowed to stay but were confined to the small island of Dejima in Nagasaki harbor.",

{id:"s08",t:"stimulus",topic:6,s:"In 1680, Pueblo communities coordinated by the leader Popé rose against Spanish colonists, killing missionaries and settlers and driving the Spanish out of New Mexico. Spanish forces returned in 1692.",

{id:"s09",t:"stimulus",topic:6,s:"In the late 1730s, after years of failed military campaigns, British authorities in Jamaica signed treaties recognizing the freedom and lands of Maroon communities in the island’s mountainous interior.",
 q:"The treaties suggest that:",

{id:"s10",t:"stimulus",topic:4,s:"Records of the trans-Atlantic slave trade show that about two males were transported for every female. Plantation owners in the Americas wanted laborers for heavy agricultural work, especially growing sugar.",

{id:"s11",t:"stimulus",topic:4,s:"In the Ottoman Empire, many enslaved people worked in households, and some held important military or government posts. In the Caribbean, most enslaved people worked on sugar plantations, and their children were born enslaved.",

{id:"s12",t:"stimulus",topic:7,s:"After taking Beijing in 1644, the Qing rulers ordered Han Chinese men to shave the front of their heads and wear a long braid called a queue, in the Manchu style. Refusing could mean death.",
 q:"This order best illustrates:",

{id:"s13",t:"stimulus",topic:7,s:"Eighteenth-century casta paintings from New Spain show families labeled by ancestry, such as Spanish, Indigenous, African, mestizo, and mulatto, arranged in a ranked sequence.",

{id:"s14",t:"stimulus",topic:5,s:"According to tradition, in 1531 the Virgin Mary appeared to an Indigenous man, Juan Diego, near Mexico City and spoke to him in Nahuatl. Her image, the Virgin of Guadalupe, became central to Mexican Catholicism. Her shrine stands on a hill associated with an earlier Mexica mother goddess.",

{id:"s15",t:"stimulus",topic:4,s:"Spanish officials required Indigenous villages in the Andes to send a share of their adult men to work in the Potosí silver mines for months at a time. The Inca state had used a similar rotating labor draft for roads and other public projects.",

{id:"s16",t:"stimulus",topic:5,s:"Throughout the 1600s, Gujarati merchants based in Surat shipped cotton textiles across the Indian Ocean and lent money to other traders, even as Portuguese and Dutch fleets patrolled the sea lanes.",

{id:"s17",t:"stimulus",topic:6,s:"In 1739, a group of enslaved people near the Stono River in South Carolina seized guns and marched south, gathering others as they went, until the colonial militia defeated them. The next year, the colony passed a law tightening control over enslaved people.",

{id:"s18",t:"stimulus",topic:2,s:"1415: Portugal captures Ceuta in North Africa. 1482: The Portuguese build a fort at Elmina on the Gold Coast. 1488: Bartolomeu Dias rounds the Cape of Good Hope. 1498: Vasco da Gama reaches Calicut, India.",

{id:"s19",t:"stimulus",topic:3,s:"After about 1700, maize and potatoes became common crops in parts of Europe, Africa, and China. Over the same period, populations in these regions grew significantly.",

 o:["American food crops contributed to population growth in Afro-Eurasia","European diseases reduced Afro-Eurasian populations","Afro-Eurasian farmers rejected American crops","Population growth caused the Columbian Exchange"],

{id:"s20",t:"stimulus",topic:6,s:"Queen Nzinga of Ndongo first negotiated with the Portuguese and even accepted baptism. When they broke their promises, she allied with the Dutch and fought Portuguese forces for decades in the mid-1600s.",

{id:"s21",t:"stimulus",topic:5,s:"In Caribbean colonies, enslaved Africans from many different language groups developed new languages that combined African grammar and vocabulary with French, English, Spanish, or Portuguese words.",
 q:"This development is an example of:",

{id:"s22",t:"stimulus",topic:1,s:"A Portuguese carrack sailing for India in the 1500s might carry dozens of cannons, a magnetic compass, an astrolabe, and charts of the African coast drawn from earlier voyages.",

/* ---------------- REASONING ---------------- */
{id:"c01",t:"reasoning",topic:2,q:"Causation: What was the main economic reason European states sponsored voyages to Asia?",
 o:["To bypass the land-based empires and middlemen that made Asian spices so expensive","To find new land for growing wheat","To escape the Black Death","To sell European manufactured goods in China"],
 why:"Land routes ran through powerful empires, so spices like pepper reached Europe at very high prices. An all-water route cut out the middlemen."},
{id:"c02",t:"reasoning",topic:2,q:"Causation: Which political change in Europe made state-sponsored exploration possible?",
 o:["Monarchs centralized power, built up militaries, and collected taxes more efficiently","Nobles took control of most governments","The Catholic Church took over royal treasuries","European states united under one emperor"],
 why:"As Europe recovered from the Black Death, monarchs took power from nobles and gained the resources to pay for expensive voyages."},
{id:"c03",t:"reasoning",topic:1,q:"Causation: Which best explains how European sailors gained access to the compass and astrolabe?",
 o:["Contact with Muslim and Asian merchants along trade routes like the Silk Roads","Spying on Ming treasure fleets in the Atlantic","Inventing them independently in Portuguese universities","Trading with Indigenous Americans"],
 why:"Trade connections, strengthened during the Pax Mongolica, carried Chinese and Islamic knowledge to Europe."},
{id:"c04",t:"reasoning",topic:4,q:"Continuity: Which was a continuity in Indian Ocean trade from 1450 to 1750?",
 o:["Asian merchants kept trading, and many profited","Portugal controlled all trade in the region","Merchants stopped relying on the monsoon winds","Europeans banned the trade in cotton textiles"],
 why:"European fleets disrupted the network, but Middle Eastern, South Asian, East Asian, and Southeast Asian merchants kept using it."},
{id:"c05",t:"reasoning",topic:4,q:"Change: Which was the biggest change in Indian Ocean trade after 1500?",
 o:["European states used armed ships to dominate trade and build fortified posts","Trade in the region came to an end","Chinese fleets took control of the entire ocean","Silver replaced every other trade good"],
 why:"The Portuguese, then the Dutch, used ship-mounted cannons to force their way in. They tried to own the network, not just join it."},
{id:"c06",t:"reasoning",topic:4,q:"Comparison: How did Spain’s approach in Asia differ from Portugal’s?",
 o:["Spain built a full colony in the Philippines, while Portugal mostly ran trading posts","Spain traded peacefully, while Portugal conquered India","Portugal colonized China, while Spain stayed in Africa","Their approaches were the same"],
 why:"Spain used the same tactics it used in the Americas, including tribute and coerced labor. Portugal mostly controlled ports and sea lanes."},
{id:"c07",t:"reasoning",topic:4,q:"Continuity: Which was a continuity in slavery from before 1450 through 1750?",
 o:["Enslaved Africans were still traded into the Mediterranean and Indian Ocean regions","Slavery became race-based for the first time","Most enslaved people worked on sugar plantations","The scale of the slave trade stayed the same"],
 why:"Older slave trades into the Islamic world continued, often with enslaved people working in households, even as the Atlantic trade grew."},
{id:"c08",t:"reasoning",topic:4,q:"Change: What was the most distinctive change in slavery in the Americas?",
 o:["Slavery became tied to race and passed from parent to child","Enslaved people could hold high government office","Slavery was limited to prisoners of war","Most enslaved people were women working in households"],
 why:"In the Americas, Blackness became identified with slavery and was used to justify brutality, and slave status became hereditary."},
{id:"c09",t:"reasoning",topic:3,q:"Effect: Which was a long-term effect of European livestock in the Americas?",
 o:["Ranching economies grew, while overgrazing caused erosion that hurt Indigenous farmers","Indigenous peoples lost all their traditional foods","The Americas stopped exporting crops","American animals spread to Europe and replaced cattle"],
 why:"With no natural predators, pigs, sheep, and cattle multiplied fast. Ranching grew, but overgrazing stripped the land and caused erosion."},
{id:"c10",t:"reasoning",topic:5,q:"Causation: Why did mercantilism encourage European states to build colonies?",
 o:["Colonies supplied raw materials and served as captive markets for the home country’s exports","Colonies paid no taxes to the home country","Colonies let states shrink their navies","Mercantilists believed trade should be free and open"],
 why:"More colonies meant more buyers for exports, and more exports meant more gold and silver flowing home."},
{id:"c11",t:"reasoning",topic:5,q:"Causation: Why were the Dutch able to push the Portuguese out of much of the Indian Ocean trade?",
 o:["The VOC’s private investment and efficient fluyt ships gave them more resources at lower cost","Portugal stopped wanting Asian spices","The Mughal Empire invited the Dutch to replace Portugal","The Dutch had invented the magnetic compass"],
 why:"Joint-stock funding pooled huge sums from investors, and cheap, cargo-heavy fluyts made Dutch trade efficient."},

/* ============================================================
   ENGINE: pure, deterministic. reduce(state, action, actor) -> new state
   Randomness comes only from state.rng, so every device that runs the
   same action on the same state gets the same result.
   ============================================================ */
const MAX_PLAYERS = 4, MIN_PLAYERS = 2;
const Q_BY_TYPE = { recall: [], stimulus: [], reasoning: [] };
const Q_BY_ID = {};
QUESTIONS.forEach(q => { Q_BY_TYPE[q.t].push(q.id); Q_BY_ID[q.id] = q; });

function rnd(st) {
  st.rng = (st.rng + 0x6D2B79F5) | 0;
  let t = st.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffled(st, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd(st) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

class GameError extends Error {}
function fail(msg) { throw new GameError(msg); }

function newGame({ mode, code, hostId, seed }) {
  return {
    v: 1, code: code || "", mode, hostId, status: "lobby",
    rng: seed | 0, settings: { rounds: 9 },
    players: [], order: [], turnIdx: 0, round: 1, phase: null,
    markets: {}, capitals: {}, decks: null, eventDeck: null,
    cur: null, event: null, revenue: null, last: null,
    history: [], log: []
  };
}

/* ---------- helpers ---------- */
const getP = (st, id) => st.players.find(p => p.id === id);
const activeId = st => st.order[st.turnIdx];
const powerOf = (st, id) => POWERS[getP(st, id).power];
const label = (st, id) => { const p = getP(st, id); return p ? p.name : "?"; };
const marketsOf = (st, id) => MARKET_ORDER.filter(m => st.markets[m] === id);
const has = (st, id, tech) => getP(st, id).techs.includes(tech);
const homeRegion = (st, id) => MARKETS[powerOf(st, id).home].region;
function log(st, text) {
  st.log.push({ r: st.round, text });
  if (st.log.length > 60) st.log.splice(0, st.log.length - 60);
}

function claimCost(st, id, mid) {
  const M = MARKETS[mid], p = getP(st, id);
  let c = M.cost;
  if (p.power === "portugal" && M.region !== "americas") c--;
  if (p.power === "spain" && M.region === "americas") c--;
  if (has(st, id, "compass") && M.region !== homeRegion(st, id)) c--;
  if (has(st, id, "caravel") && (M.region === "africa" || M.region === "americas")) c--;
  return Math.max(1, c);
}
function seizeCost(st, id, mid) {
  const ownerId = st.markets[mid];
  let c = claimCost(st, id, mid) + 3;
  if (getP(st, id).power === "dutch") c -= 2;
  if (ownerId && has(st, ownerId, "carrack")) c += 2;
  if (ownerId && getP(st, ownerId).power === "asante" && powerOf(st, id).euro) c += 2;
  return Math.max(2, c);
}
function techCost(st, id, tech) { return TECHS[tech].cost; }

function incomeParts(st, id) {
  const p = getP(st, id), mine = marketsOf(st, id);
  const parts = [{ label: "Base", n: 2 }];
  if (mine.length) parts.push({ label: "Markets", n: mine.length });
  if (has(st, id, "lateen")) parts.push({ label: "Lateen sail", n: 1 });
  if (has(st, id, "fluyt") && mine.length >= 2) parts.push({ label: "Fluyt", n: Math.floor(mine.length / 2) });
  if (p.power === "china") {
    const n = Math.floor(MARKET_ORDER.filter(m => MARKETS[m].good === "silver" && st.markets[m]).length / 2);
    if (n) parts.push({ label: "Silver magnet", n });
  }
  if (p.power === "spain") {
    const n = mine.filter(m => MARKETS[m].good === "silver").length;
    if (n) parts.push({ label: "Silver fleets", n });
  }
  if (p.power === "asante") {
    const n = mine.filter(m => MARKETS[m].good === "gold").length;
    if (n) parts.push({ label: "Gold and guns", n });
  }
  return parts;
}

function score(st, id) {
  const p = getP(st, id), mine = marketsOf(st, id);
  const regions = new Set(mine.map(m => MARKETS[m].region));
  const goods = new Set(mine.map(m => MARKETS[m].good));
  const nav = NAV_SET.every(t => p.techs.includes(t));
  const parts = [
    { key: "markets", label: "Markets held", n: mine.length * 2, note: `${mine.length} × 2` },
    { key: "regions", label: "Regions beyond the first", n: Math.max(0, regions.size - 1) * 2, note: `${regions.size} region${regions.size === 1 ? "" : "s"}` },
    { key: "goods", label: "Different goods", n: goods.size, note: `${goods.size} of 6` },
    { key: "techs", label: "Technologies", n: p.techs.length + (nav ? 2 : 0), note: nav ? `${p.techs.length} + 2 navigation set` : `${p.techs.length}` },
    { key: "knowledge", label: "Correct answers", n: p.correct, note: `${p.correct} of ${p.answered}` },
    { key: "bullion", label: "Bullion", n: Math.floor(p.silver / 5), note: `${p.silver} silver ÷ 5` }
  ];
  return { total: parts.reduce((s, x) => s + x.n, 0), parts };
}

function standings(st) {
  return st.players.map(p => ({ id: p.id, score: score(st, p.id).total, silver: p.silver }))
    .sort((a, b) => b.score - a.score || b.silver - a.silver);
}

/* ---------- turn flow ---------- */
function beginTurn(st) {
  const id = activeId(st), p = getP(st, id);
  const parts = incomeParts(st, id);
  const total = parts.reduce((s, x) => s + x.n, 0);
  p.silver += total;
  st.revenue = { id, total, parts };
  st.phase = "pick";
  st.cur = null;
  log(st, `${label(st, id)} collects ${total} silver in revenue.`);
}

function endTurn(st) {
  st.turnIdx++;
  if (st.turnIdx >= st.order.length) {
    if (st.round >= st.settings.rounds) { finish(st); return; }
    drawEvent(st);
    return;
  }
  beginTurn(st);
}

function finish(st) {
  st.status = "over";
  st.phase = null;
  st.cur = null;
  const s = standings(st);
  log(st, `Game over. ${label(st, s[0].id)} wins with ${s[0].score} prestige.`);
}

function drawEvent(st) {
  const d = st.eventDeck;
  if (d.i >= d.order.length) { d.order = shuffled(st, EVENT_ORDER); d.i = 0; }
  const eid = d.order[d.i++];
  const results = EVENT_FX[eid](st);
  st.event = { id: eid, round: st.round, results: results.length ? results : ["No one is affected this time."] };
  st.phase = "event";
  st.cur = null;
  log(st, `Event: ${EVENTS[eid].title}.`);
}

/* ---------- event effects ---------- */
function evGain(st, id, n, out, why) {
  if (!id || n <= 0) return;
  getP(st, id).silver += n;
  out.push(`${label(st, id)} gains ${n} silver${why ? " (" + why + ")" : ""}.`);
}
function evLose(st, id, n, out, why) {
  if (!id || n <= 0) return;
  const p = getP(st, id), js = has(st, id, "jointstock");
  const amt = Math.min(js ? Math.floor(n / 2) : n, p.silver);
  p.silver -= amt;
  const notes = [why, js ? "halved by limited liability" : ""].filter(Boolean).join(", ");
  out.push(`${label(st, id)} loses ${amt} silver${notes ? " (" + notes + ")" : ""}.`);
}
function evRelease(st, mid, out, test) {
  const owner = st.markets[mid];
  if (!owner || st.capitals[mid] || !test(getP(st, owner))) return;
  st.markets[mid] = null;
  out.push(`${label(st, owner)} loses control of ${MARKETS[mid].name}.`);
}
const isEuro = p => POWERS[p.power].euro;
const isIberian = p => p.power === "portugal" || p.power === "spain";

const EVENT_FX = {
  silverboom(st) { const out = []; MARKET_ORDER.filter(m => MARKETS[m].good === "silver").forEach(m => evGain(st, st.markets[m], 2, out, MARKETS[m].name)); return out; },
  greatdying(st) { const out = []; st.players.forEach(p => { const n = marketsOf(st, p.id).filter(m => MARKETS[m].region === "americas").length; evLose(st, p.id, n, out); }); return out; },
  pueblo(st) { const out = []; evRelease(st, "newspain", out, isEuro); return out; },
  maroons(st) { const out = []; ["caribbean", "brazil"].forEach(m => evLose(st, st.markets[m], 2, out, MARKETS[m].name)); return out; },
  stono(st) { const out = []; evLose(st, st.markets.carolina, 3, out, "Carolina"); return out; },
  nzinga(st) { const out = []; evRelease(st, "luanda", out, isIberian); const d = st.players.find(p => p.power === "dutch"); if (d) evGain(st, d.id, 2, out, "alliance with Nzinga"); return out; },
  tokugawa(st) { const out = []; evRelease(st, "nagasaki", out, isIberian); return out; },
  mingexpels(st) { const out = []; evRelease(st, "canton", out, isEuro); return out; },
  voc(st) { const out = []; st.players.forEach(p => { if (p.techs.includes("jointstock")) evGain(st, p.id, 3, out); }); return out; },
  anglodutch(st) {
    const out = []; const counts = st.players.map(p => marketsOf(st, p.id).length); const max = Math.max(...counts);
    st.players.forEach((p, i) => { if (counts[i] === max && max > 0) evLose(st, p.id, 2, out, "war costs"); }); return out;
  },
  fronde(st) { const out = []; st.players.forEach(p => { if (p.silver >= 10) evLose(st, p.id, 3, out, "new taxes"); }); return out; },
  newcrops(st) { const out = []; st.players.forEach(p => evGain(st, p.id, 2, out)); return out; },
  gujarati(st) { const out = []; MARKET_ORDER.filter(m => MARKETS[m].region === "indian").forEach(m => evGain(st, st.markets[m], 1, out, MARKETS[m].name)); return out; },
  asanterise(st) { const out = []; MARKET_ORDER.filter(m => MARKETS[m].good === "gold").forEach(m => evGain(st, st.markets[m], 2, out, MARKETS[m].name)); return out; },
  kongo(st) { const out = []; evGain(st, st.markets.kongo, 3, out, "Mbanza Kongo"); return out; },
  galleons(st) { const out = []; evGain(st, st.markets.manila, 3, out, "Manila"); evGain(st, st.markets.canton, 2, out, "Canton"); return out; },
  balance(st) {
    const out = []; const g = st.players.map(p => new Set(marketsOf(st, p.id).map(m => MARKETS[m].good)).size); const max = Math.max(...g);
    st.players.forEach((p, i) => { if (g[i] === max && max > 0) evGain(st, p.id, 3, out, `${max} kinds of goods`); }); return out;
  }
};

/* ---------- reducer ---------- */
function reduce(input, action, actor) {
  const st = JSON.parse(JSON.stringify(input));
  const local = st.mode === "local";
  const isHost = local || actor === st.hostId;
  const me = getP(st, actor);
  const mustBeActive = () => { if (st.status !== "playing") fail("The game isn’t running."); if (!local && activeId(st) !== actor) fail("It’s not your turn."); };
  const phase = ph => { if (st.phase !== ph) fail("That move isn’t available right now."); };
  const A = activeId(st);

  switch (action.type) {
    /* ----- lobby ----- */
    case "join": {
      const name = String(action.name || "").trim().slice(0, 20);
      if (!name) fail("Enter a nickname first.");
      if (me) { me.name = name; return st; }
      if (st.status !== "lobby") fail("That game has already started.");
      if (st.players.length >= MAX_PLAYERS) fail("That game is full (4 players).");
      st.players.push({ id: actor, name, power: null, silver: 0, techs: [], correct: 0, answered: 0 });
      return st;
    }
    case "leave": {
      if (st.status !== "lobby") fail("You can only leave from the lobby.");
      st.players = st.players.filter(p => p.id !== actor);
      if (actor === st.hostId && st.players.length) st.hostId = st.players[0].id;
      return st;
    }
    case "pickPower": {
      if (st.status !== "lobby") fail("Powers are chosen in the lobby.");
      const target = local && action.player ? getP(st, action.player) : me;
      if (!target) fail("Join the game first.");
      if (action.power !== null && !POWERS[action.power]) fail("Unknown power.");
      if (action.power && st.players.some(p => p.power === action.power && p.id !== target.id)) fail("Someone already chose that power.");
      target.power = action.power;
      return st;
    }
    case "setRounds": {
      if (!isHost) fail("Only the host can change the game length.");
      if (st.status !== "lobby") fail("The game has started.");
      if (![6, 9, 12].includes(action.rounds)) fail("Choose 6, 9, or 12 rounds.");
      st.settings.rounds = action.rounds;
      return st;
    }
    case "start": {
      if (!isHost) fail("Only the host can start the game.");
      if (st.status !== "lobby") fail("The game has already started.");
      if (st.players.length < MIN_PLAYERS) fail("You need at least 2 players.");
      if (st.players.some(p => !p.power)) fail("Every player needs to choose a power.");
      st.order = shuffled(st, st.players.map(p => p.id));
      MARKET_ORDER.forEach(m => { st.markets[m] = null; });
      st.players.forEach(p => {
        const P = POWERS[p.power];
        p.silver = P.silver; p.techs = P.startTech.slice(); p.correct = 0; p.answered = 0;
        st.markets[P.home] = p.id; st.capitals[P.home] = p.id;
      });
      st.decks = {};
      Object.keys(Q_BY_TYPE).forEach(t => { st.decks[t] = { order: shuffled(st, Q_BY_TYPE[t]), i: 0 }; });
      st.eventDeck = { order: shuffled(st, EVENT_ORDER), i: 0 };
      st.status = "playing"; st.round = 1; st.turnIdx = 0; st.history = []; st.log = [];
      log(st, `The year is 1450. Turn order: ${st.order.map(id => label(st, id)).join(", ")}.`);
      beginTurn(st);
      return st;
    }

    /* ----- a turn ----- */
    case "chooseQ": {
      mustBeActive(); phase("pick");
      if (!QTYPES[action.qtype]) fail("Unknown question type.");
      const d = st.decks[action.qtype];
      if (d.i >= d.order.length) { d.order = shuffled(st, Q_BY_TYPE[action.qtype]); d.i = 0; }
      const qid = d.order[d.i++];
      st.cur = { qtype: action.qtype, qid, perm: shuffled(st, [0, 1, 2, 3]), choice: null, ok: null, reward: 0, key: `${st.round}-${st.turnIdx}-${qid}` };
      st.phase = "question";
      return st;
    }
    case "answer": {
      mustBeActive(); phase("question");
      const c = action.choice | 0;
      if (c < 0 || c > 3) fail("Pick one of the four answers.");
      const p = getP(st, A);
      const ok = st.cur.perm[c] === 0;
      let reward = 0;
      if (ok) { reward = QTYPES[st.cur.qtype].reward + (p.techs.includes("astrolabe") ? 1 : 0); p.silver += reward; p.correct++; }
      p.answered++;
      st.cur.choice = c; st.cur.ok = ok; st.cur.reward = reward;
      st.history.push({ id: A, qid: st.cur.qid, ok, choice: st.cur.perm[c] });
      st.phase = "reveal";
      log(st, ok ? `${label(st, A)} answers a ${QTYPES[st.cur.qtype].name} question correctly: +${reward} silver.` : `${label(st, A)} misses a ${QTYPES[st.cur.qtype].name} question.`);
      return st;
    }
    case "toAction": {
      mustBeActive(); phase("reveal");
      st.phase = "action";
      return st;
    }
    case "claim": {
      mustBeActive(); phase("action");
      const mid = action.market, M = MARKETS[mid];
      if (!M) fail("Unknown market.");
      if (st.markets[mid]) fail("That market is already held.");
      const cost = claimCost(st, A, mid), p = getP(st, A);
      if (p.silver < cost) fail(`You need ${cost} silver to claim ${M.name}.`);
      p.silver -= cost; st.markets[mid] = A;
      st.last = { id: A, kind: "claim", market: mid };
      log(st, `${label(st, A)} claims ${M.name} for ${cost} silver.`);
      mughalBonus(st, A, mid);
      endTurn(st);
      return st;
    }
    case "seize": {
      mustBeActive(); phase("action");
      const mid = action.market, M = MARKETS[mid];
      if (!M) fail("Unknown market.");
      const owner = st.markets[mid];
      if (!owner) fail("That market is open. Claim it instead.");
      if (owner === A) fail("You already hold that market.");
      if (st.capitals[mid]) fail(`${M.name} is a capital and can’t be seized.`);
      const cost = seizeCost(st, A, mid), p = getP(st, A);
      if (p.silver < cost) fail(`You need ${cost} silver to seize ${M.name}.`);
      p.silver -= cost; st.markets[mid] = A;
      st.last = { id: A, kind: "seize", market: mid, from: owner };
      log(st, `${label(st, A)} seizes ${M.name} from ${label(st, owner)} for ${cost} silver.`);
      mughalBonus(st, A, mid);
      endTurn(st);
      return st;
    }
    case "adopt": {
      mustBeActive(); phase("action");
      const T = TECHS[action.tech];
      if (!T) fail("Unknown technology.");
      const p = getP(st, A);
      if (p.techs.includes(action.tech)) fail("You already have that technology.");
      const cost = techCost(st, A, action.tech);
      if (p.silver < cost) fail(`You need ${cost} silver to adopt the ${T.name}.`);
      p.silver -= cost; p.techs.push(action.tech);
      st.last = { id: A, kind: "adopt", tech: action.tech };
      log(st, `${label(st, A)} adopts the ${T.name}.`);
      endTurn(st);
      return st;
    }
    case "hold": {
      mustBeActive(); phase("action");
      getP(st, A).silver += 1;
      st.last = { id: A, kind: "hold" };
      log(st, `${label(st, A)} holds reserves (+1 silver).`);
      endTurn(st);
      return st;
    }
    case "skip": {
      if (!isHost) fail("Only the host can skip a turn.");
      if (st.status !== "playing" || st.phase === "event") fail("There’s no turn to skip.");
      log(st, `The host skipped ${label(st, A)}’s turn.`);
      st.last = { id: A, kind: "skip" };
      endTurn(st);
      return st;
    }
    case "continue": {
      if (st.status !== "playing") fail("The game isn’t running.");
      phase("event");
      if (!local && !isHost && actor !== st.order[0]) fail("Waiting for the next player to continue.");
      st.round++; st.turnIdx = 0; st.event = null;
      log(st, `Round ${st.round} begins.`);
      beginTurn(st);
      return st;
    }
    case "endGame": {
      if (!isHost) fail("Only the host can end the game.");
      if (st.status !== "playing") fail("The game isn’t running.");
      log(st, "The host ended the game early.");
      finish(st);
      return st;
    }
    default: fail("Unknown action.");
  }
}

function mughalBonus(st, actor, mid) {
  if (MARKETS[mid].region !== "indian") return;
  const m = st.players.find(p => p.power === "mughal" && p.id !== actor);
  if (!m) return;
  m.silver += 1;
  log(st, `${m.name} earns 1 silver from Gujarati merchants.`);
}

/* Actions the active player could take right now (used by the UI and the test bots). */
function legalMoves(st, id) {
  const p = getP(st, id), out = [];
  MARKET_ORDER.forEach(m => {
    const o = st.markets[m];
    if (!o) { const c = claimCost(st, id, m); if (p.silver >= c) out.push({ type: "claim", market: m, cost: c }); }
    else if (o !== id && !st.capitals[m]) { const c = seizeCost(st, id, m); if (p.silver >= c) out.push({ type: "seize", market: m, cost: c }); }
  });
  TECH_ORDER.forEach(t => { if (!p.techs.includes(t) && p.silver >= techCost(st, id, t)) out.push({ type: "adopt", tech: t, cost: techCost(st, id, t) }); });
  out.push({ type: "hold", cost: 0 });
  return out;
}

const K = 3, LON0 = -110, LAT0 = 58, MAP_W = 255 * K, MAP_H = 96 * K;

function curve(pts, closed) {

  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;

    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])},${f1(p2[1])}`;

}
const proj = pts => pts.map(([la, lo]) => [PX(lo), PY(la)]);

function staticMapSVG(withIds) {
  const land = LAND.map(p => `<path d="${curve(proj(p), true)}"/>`).join("");
  const lakes = LAKES.map(p => `<path d="${curve(proj(p), true)}"/>`).join("");
  const roses = [[8, -32], [-12, 80], [24, 150]].map(([la, lo]) => [PX(lo), PY(la)]);
  let rhumb = "";
  roses.forEach(([cx, cy]) => {

      const a = i * Math.PI / 8, dx = Math.cos(a) * 1600, dy = Math.sin(a) * 1600;
      rhumb += `<line x1="${f1(cx - dx)}" y1="${f1(cy - dy)}" x2="${f1(cx + dx)}" y2="${f1(cy + dy)}" class="${i % 2 ? "rh2" : "rh1"}"/>`;

    return `<g class="rose"><circle cx="${f1(cx)}" cy="${f1(cy)}" r="10.5"/><polygon points="${pts.join(" ")}"/></g>`;
  }).join("");
  const routes = ROUTES.map(r => {

  }).join("");
  const mLabels = MARKET_ORDER.map(id => {

  const symbols = Object.keys(GLYPHS).map(g => `<symbol id="g-${g}" viewBox="-5 -5 10 10" overflow="visible">${GLYPHS[g]}</symbol>`).join("");
  return `<svg class="map" viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of the world’s oceans, 1450 to 1750, showing trade markets">

    ${withIds ? symbols : ""}
  </defs>
  <g clip-path="url(#mapClip${withIds ? "" : "S"})">
    <rect class="sea" width="${MAP_W}" height="${MAP_H}"/>
    <g class="rhumb">${rhumb}</g>
    ${rosesG}

    <g class="lakes">${lakes}</g>
    ${oceans}
    <g class="routes">${routes}</g>
    ${cities}

  </g>
  <rect class="frame" x=".5" y=".5" width="${MAP_W - 1}" height="${MAP_H - 1}"/>

}

/* ---------------- ONLINE SESSION (Firebase) ---------------- */
const FB = { db: null, uid: null, ref: null, presRef: null, presAll: null, conn: null };
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(s); });
}
async function fbReady() {
  if (FB.uid) return FB.uid;
  if (!window.firebase) {
    for (const m of ["app", "auth", "database"]) await loadScript(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}-compat.js`);
  }

const pack = (st, v) => ({ s: JSON.stringify(st), v, t: firebase.database.ServerValue.TIMESTAMP });
function genCode() { const L = "ABCDEFGHJKMNPQRSTUVWXYZ"; let c = ""; for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)]; return c; }

async function createOnline(name) {
  const uid = await fbReady();
  for (let i = 0; i < 6; i++) {
    const code = genCode();
    let st = newGame({ mode: "online", code, hostId: uid, seed: (Math.random() * 2147483647) | 0 });
    st = reduce(st, { type: "join", name }, uid);
    const res = await FB.db.ref("games/" + code).transaction(cur => cur === null ? pack(st, 1) : undefined);
    if (res.committed) { await connect(code); return; }
  }
  throw new Error("Couldn’t open a new room. Try again.");
}
async function joinOnline(code, name) {
  const uid = await fbReady();
  const snap = await FB.db.ref("games/" + code).once("value");
  if (!snap.exists()) throw new Error(`There’s no game with the code ${code}. Check the code with your host.`);
  FB.ref = FB.db.ref("games/" + code);
  net = { kind: "online", me: uid, code, dispatch: onlineDispatch };
  await onlineDispatch({ type: "join", name });
  await connect(code);
}
async function onlineDispatch(action) {
  let err = null;
  const res = await FB.ref.transaction(cur => {
    if (cur === null) return null;
    try { err = null; return pack(reduce(JSON.parse(cur.s), action, FB.uid), (cur.v || 0) + 1); }
    catch (e) { err = e; return; }
  });
  if (err) throw err;
  if (!res.committed) throw new Error("That move didn’t go through. Try again.");
  if (res.snapshot.val() === null) throw new Error("That game no longer exists.");
}
async function connect(code) {
  disconnect(false);
  FB.ref = FB.db.ref("games/" + code);
  net = { kind: "online", me: FB.uid, code, dispatch: onlineDispatch };
  store.set("tw.lastCode", code);
  FB.ref.on("value", snap => {
    const v = snap.val();
    if (!v) { disconnect(true); S = null; ui.screen = "home"; render(); toast("That game was closed."); return; }
    try { S = JSON.parse(v.s); } catch (e) { return; }
    route(); render();
  }, err => toast(friendlyError(err)));
  FB.presRef = FB.db.ref(`presence/${code}/${FB.uid}`);
  FB.conn = FB.db.ref(".info/connected");
  FB.conn.on("value", s => { if (s.val() === true) { FB.presRef.onDisconnect().remove(); FB.presRef.set(true); } });
  FB.presAll = FB.db.ref(`presence/${code}`);
  FB.presAll.on("value", s => { present = new Set(Object.keys(s.val() || {})); if (ui.screen !== "home") render(); });
}
function disconnect(forget) {

  if (FB.conn) FB.conn.off();
  if (FB.presRef) { FB.presRef.onDisconnect().cancel(); FB.presRef.remove(); }
  FB.ref = FB.presAll = FB.conn = FB.presRef = null;
  present = new Set();
  if (forget) store.del("tw.lastCode");
