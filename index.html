  const rows = L.players.slice(0, n).map((p, i) => {
    const taken = L.players.slice(0, n).filter((q, j) => j !== i).map(q => q.power);
    const opts = POWER_ORDER.map(k => `<option value="${k}" ${p.power === k ? "selected" : ""} ${taken.includes(k) ? "disabled" : ""}>${esc(POWERS[k].name)}</option>`).join("");
    return `<div class="setupRow">
      <span class="chip" style="--c:${POWERS[p.power].color}" aria-hidden="true">${POWERS[p.power].short}</span>
      <label class="field grow"><span>Player ${i + 1}</span><input data-lp="${i}" maxlength="20" value="${esc(p.name)}" placeholder="Nickname"></label>
      <label class="field"><span>Power</span><select data-lpow="${i}">${opts}</select></label>
    </div>`;
  }).join("");
  return `${topBarSimple()}
  <main class="page narrow">
    <h1 class="pageTitle">Play on one screen</h1>
    <p class="hint">Everyone shares this device. Each player chooses a different power.</p>
    <fieldset class="seg"><legend>Players</legend>
      ${[2, 3, 4].map(k => `<button class="segBtn${n === k ? " on" : ""}" data-a="lcount" data-n="${k}" aria-pressed="${n === k}">${k}</button>`).join("")}
    </fieldset>
    <div class="setupRows">${rows}</div>
    ${lengthPicker(L.rounds, "lrounds")}
    <details class="powersRef"><summary>What each power does</summary>${powerRef()}</details>
    <div class="actions"><button class="btn" data-a="localStart">Start the game</button><button class="btn ghost" data-a="home">Back</button></div>
  </main>`;
}
function topBarSimple() { return `<header class="bar"><button class="wordmark asLink" data-a="home">Trade Winds</button><span class="barBtns"><button class="btn ghost sm" data-a="rules">Rules</button></span></header>`; }
function lengthPicker(cur, action) {
  const opts = [[6, "Short", "6 rounds"], [9, "Standard", "9 rounds"], [12, "Long", "12 rounds"]];
  return `<fieldset class="seg"><legend>Game length</legend>
    ${opts.map(([r, a, b]) => `<button class="segBtn${cur === r ? " on" : ""}" data-a="${action}" data-n="${r}" aria-pressed="${cur === r}">${a}<small>${b}</small></button>`).join("")}
  </fieldset>`;
}
function powerRef() {
  return `<div class="powerRef">${POWER_ORDER.map(k => { const P = POWERS[k]; return `<div><b><span class="chip sm" style="--c:${P.color}">${P.short}</span>${esc(P.name)}</b><p>${esc(P.abilityText)} Starts with ${esc(MARKETS[P.home].name)}${P.startTech.length ? ", the " + esc(TECHS[P.startTech[0]].name) : ""}, and ${P.silver} silver.</p></div>`; }).join("")}</div>`;
}

/* ---- Online lobby ---- */
function lobbyView() {
  const me = getP(S, net.me), isHost = S.hostId === net.me;
  const players = S.players.map(p => `<li>${chip(p)}<span class="pname">${esc(p.name)}${p.id === net.me ? " (you)" : ""}${p.id === S.hostId ? " <em>host</em>" : ""}</span><span class="pstat">${p.power ? esc(POWERS[p.power].name) : "Choosing a power"}</span>${present.has(p.id) ? "" : `<span class="away">away</span>`}</li>`).join("");
  const tiles = POWER_ORDER.map(k => {
    const P = POWERS[k], takenBy = S.players.find(p => p.power === k), mine = me && me.power === k;
    const dis = takenBy && !mine;
    return `<button class="powerTile${mine ? " on" : ""}" data-a="pick" data-p="${k}" ${dis ? "disabled" : ""} aria-pressed="${mine}" style="--c:${P.color}">
      <span class="ptHead"><span class="chip" style="--c:${P.color}">${P.short}</span><b>${esc(P.name)}</b>${dis ? `<span class="taken">${esc(takenBy.name)}</span>` : ""}</span>
      <span class="ptAbility">${esc(P.ability)}</span>
      <span class="ptText">${esc(P.abilityText)}</span>
      <span class="ptStart">Starts with ${esc(MARKETS[P.home].name)}${P.startTech.length ? ", the " + esc(TECHS[P.startTech[0]].name) : ""}, and ${P.silver} silver.</span>
    </button>`;
  }).join("");
  const ready = S.players.length >= 2 && S.players.every(p => p.power);
  const why = S.players.length < 2 ? "Waiting for at least one more player to join." : !ready ? "Waiting for everyone to choose a power." : "";
  return `${topBar()}
  <main class="page">
    <section class="lobbyTop">
      <div class="roomBig"><span>Room code</span><b>${esc(S.code)}</b><button class="btn ghost sm" data-a="copyCode">Copy code</button></div>
      <div><h2>Players (${S.players.length} of 4)</h2><ul class="plist">${players}</ul></div>
    </section>
    <h2>Choose your power</h2>
    <div class="powerGrid">${tiles}</div>
    ${isHost ? `${lengthPicker(S.settings.rounds, "rounds")}
      <div class="actions"><button class="btn" data-a="start" ${ready ? "" : "disabled"}>Start the game</button>${why ? `<span class="hint">${why}</span>` : ""}</div>`
      : `<p class="hint waiting">Waiting for ${esc((getP(S, S.hostId) || {}).name || "the host")} to start a ${S.settings.rounds}-round game.</p>`}
  </main>`;
}

/* ---- Game ---- */
function gameView() {
  return `${topBar()}
  <div class="board">
    <section class="boardMain">
      <div id="mapSlot" class="mapFrame"></div>
      <p class="mapHint">Swipe the map sideways to see all four regions.</p>
      ${legend()}
      <div class="ledgers">${ledgers()}</div>
      ${logView()}
    </section>
    <aside class="rail">
      ${ui.sel ? marketPanel(ui.sel) : ""}
      <div class="turn" aria-live="polite">${turnPanel()}</div>
    </aside>
  </div>`;
}
function legend() {
  return `<div class="legend">${Object.keys(GOODS).map(g => `<span><svg width="14" height="14" viewBox="-7 -7 14 14" aria-hidden="true"><circle r="6.5" class="lgDot"/><use href="#g-${g}" x="-5" y="-5" width="10" height="10" class="gly"/></svg>${esc(GOODS[g].name)}</span>`).join("")}
    <span><svg width="14" height="14" viewBox="-7 -7 14 14" aria-hidden="true"><circle r="5" class="lgDot"/><circle r="6.3" fill="none" stroke="#E4D9BF" stroke-width="1.1"/></svg>Capital, can’t be seized</span>
    <span><svg width="22" height="8" aria-hidden="true"><path d="M1,4 H21" stroke="#E08B7A" stroke-width="1.6" stroke-dasharray="1.6 3"/></svg>Forced migration</span></div>`;
}
function ledgers() {
  const A = activeId(S);
  return S.order.map(id => {
    const p = getP(S, id), sc = score(S, id), n = MARKET_ORDER.filter(m => S.markets[m] === id).length;
    const away = net.kind === "online" && !present.has(id);
    const canSkip = net.kind === "online" && S.hostId === net.me && id === A && id !== net.me && S.phase !== "event";
    return `<div class="ledger${id === A && S.phase !== "event" ? " now" : ""}" style="--c:${pColor(p)}">
      <div class="lgTop">${chip(p)}<span class="lgName"><b>${esc(p.name)}</b><span>${p.name !== POWERS[p.power].name ? esc(POWERS[p.power].name) : ""}${net.kind === "online" && id === net.me ? (p.name !== POWERS[p.power].name ? ", you" : "You") : ""}</span></span><span class="prest" title="Prestige"><b>${sc.total}</b><span>prestige</span></span></div>
      <div class="lgStats"><span><b>${p.silver}</b> silver</span><span><b>${n}</b> market${n === 1 ? "" : "s"}</span><span><b>${p.correct}</b>/${p.answered} correct</span></div>
      <div class="lgTech">${p.techs.length ? p.techs.map(t => `<span>${esc(TECHS[t].name)}</span>`).join("") : `<span class="none">No technologies yet</span>`}</div>
      ${away ? `<div class="lgAway">Away${canSkip ? ` <button class="btn link sm" data-a="skip">Skip this turn</button>` : ""}</div>` : ""}
    </div>`;
  }).join("");
}
function logView() {
  const items = S.log.slice(-8).reverse().map(l => `<li><span class="lr">R${l.r}</span>${esc(l.text)}</li>`).join("");
  return `<details class="log"><summary>Recent moves</summary><ul>${items}</ul></details>`;
}

function turnPanel() {
  if (S.phase === "event") return eventCard();
  const A = activeId(S), p = getP(S, A), mine = isMine();
  const head = (title) => `<div class="tHead" style="--c:${pColor(p)}">${chip(p, "lg")}<div><h2>${title}</h2>${p.name !== POWERS[p.power].name ? `<p>${esc(POWERS[p.power].name)}</p>` : ""}</div></div>`;
  const whoseTurn = net.kind === "local" ? `${esc(p.name)}’s turn` : mine ? "Your turn" : `${esc(p.name)}’s turn`;
  let body = "";
  if (S.phase === "pick") {
    const rv = S.revenue && S.revenue.id === A ? S.revenue : null;
    const revLine = rv ? `<p class="revenue">Revenue: <b>+${rv.total} silver</b> (${rv.parts.map(x => `${esc(x.label.toLowerCase())} ${x.n}`).join(", ")}). Now ${p.silver} silver.</p>` : "";
    const lastLine = lastMoveLine();
    if (mine) {
      const astro = p.techs.includes("astrolabe");
      body = `${lastLine}${revLine}<h3 class="step">Choose a question</h3>
        <div class="qPick">${Object.keys(QTYPES).map(t => `<button class="qBtn" data-a="chooseQ" data-t="${t}"><span class="qName">${QTYPES[t].name}</span><span class="qDesc">${QTYPES[t].desc}</span><span class="qPay">${QTYPES[t].reward + (astro ? 1 : 0)} silver</span></button>`).join("")}</div>
        <p class="hint">A correct answer also adds 1 prestige.${astro ? " Your astrolabe adds 1 silver." : ""}</p>`;
    } else {
      body = `${lastLine}${revLine}<p class="waiting">Waiting for ${esc(p.name)} to choose a question.</p>`;
    }
  } else if (S.phase === "question" || S.phase === "reveal") {
    body = questionCard(mine, p);
  } else if (S.phase === "action") {
    body = mine ? actionPanel(p) : `<p class="waiting">${esc(p.name)} is choosing a move.</p>${S.cur ? `<p class="hint">${S.cur.ok ? `${esc(p.name)} answered correctly and earned ${S.cur.reward} silver.` : `${esc(p.name)} missed the question.`}</p>` : ""}`;
  }
  return head(whoseTurn) + body;
}
function lastMoveLine() {
  const L = S.last; if (!L) return "";
  const p = getP(S, L.id); if (!p) return "";
  let t = "";
  if (L.kind === "claim") t = `claimed ${MARKETS[L.market].name}`;
  else if (L.kind === "seize") t = `seized ${MARKETS[L.market].name} from ${esc((getP(S, L.from) || {}).name || "a rival")}`;
  else if (L.kind === "adopt") t = `adopted the ${TECHS[L.tech].name}`;
  else if (L.kind === "hold") t = "held reserves";
  else if (L.kind === "skip") t = "had a turn skipped";
  return `<p class="lastMove">${chip(p, "sm")}Last turn, ${esc(p.name)} ${t}.</p>`;
}

function questionCard(mine, p) {
  const c = S.cur, q = Q_BY_ID[c.qid], reveal = S.phase === "reveal";
  const correctIdx = c.perm.indexOf(0);
  const g = ui.guess && ui.guess.key === c.key ? ui.guess.choice : null;
  const canGuess = !mine && net.kind === "online" && !reveal;
  const opts = c.perm.map((orig, i) => {
    const txt = q.o[orig];
    let cls = "opt";
    if (reveal) { if (i === correctIdx) cls += " right"; else if (i === c.choice) cls += " wrong"; }
    else if (canGuess && g === i) cls += " guessed";
    const action = mine && !reveal ? `data-a="answer" data-c="${i}"` : canGuess ? `data-a="guess" data-c="${i}"` : "";
    const dis = !action ? "disabled" : "";
    const mark = reveal && i === correctIdx ? `<span class="mark">Correct answer</span>` : reveal && i === c.choice ? `<span class="mark">${net.kind === "local" || mine ? "Your answer" : esc(p.name) + "’s answer"}</span>` : "";
    return `<li><button class="${cls}" ${action} ${dis}><span class="let">${LETTERS[i]}</span><span class="otx">${esc(txt)}</span>${mark}</button></li>`;
  }).join("");
  let result = "";
  if (reveal) {
    const name = net.kind === "local" || mine ? "" : esc(p.name) + " ";
    result = `<div class="result ${c.ok ? "ok" : "no"}">
      <p class="verdict">${c.ok ? `${name ? name + "is correct" : "Correct"}. +${c.reward} silver and 1 prestige.` : `${name ? name + "missed this one" : "Not quite"}.`}</p>
      ${c.ok ? "" : `<p class="ansLine">The answer is <b>${LETTERS[correctIdx]}. ${esc(q.o[0])}</b></p>`}
      ${g !== null && !mine && net.kind === "online" ? `<p class="guessNote">Your guess, ${LETTERS[g]}, was ${g === correctIdx ? "right" : "not right"}.</p>` : ""}
      <p class="why">${esc(q.why)}</p>
    </div>`;
  }
  const footer = reveal
    ? (mine ? `<button class="btn ink" data-a="toAction">Make your move</button>` : `<p class="waiting">Waiting for ${esc(p.name)} to continue.</p>`)
    : (mine ? "" : canGuess ? `<p class="hint ink">Guess along. Only ${esc(p.name)}’s answer counts.</p>` : `<p class="waiting">Waiting for ${esc(p.name)} to answer.</p>`);
  return `<article class="card qCard${reveal ? " revealed" : ""}">
    <div class="qMeta"><span>${QTYPES[c.qtype].name} question, worth ${QTYPES[c.qtype].reward} silver</span><span>${esc(TOPICS[q.topic])}</span></div>
    ${reveal ? result + footer : ""}
    ${q.s ? `<figure class="stim"><figcaption>Practice source, written for this game from the historical record</figcaption><p>${esc(q.s)}</p></figure>` : ""}
    <p class="qText">${esc(q.q)}</p>
    <ol class="opts">${opts}</ol>
    ${reveal ? "" : footer}
  </article>`;
}

function actionPanel(p) {
  const A = p.id;
  const verdict = S.cur ? `<p class="hint">${S.cur.ok ? `Correct: +${S.cur.reward} silver.` : "No silver from the question this time."} You have <b>${p.silver} silver</b>.</p>` : "";
  const claims = {}, seizes = [];
  MARKET_ORDER.forEach(m => {
    const o = S.markets[m];
    if (!o) { const c = claimCost(S, A, m); if (p.silver >= c) (claims[MARKETS[m].region] = claims[MARKETS[m].region] || []).push([m, c]); }
    else if (o !== A && !S.capitals[m]) { const c = seizeCost(S, A, m); if (p.silver >= c) seizes.push([m, c, o]); }
  });
  const gly = M => `<span class="mGly"><svg width="18" height="18" viewBox="-9 -9 18 18" aria-hidden="true"><circle r="8.5" class="lgDot"/><use href="#g-${M.good}" x="-5" y="-5" width="10" height="10" class="gly"/></svg></span>`;
  const claimRows = Object.keys(REGIONS).filter(r => claims[r]).map(r =>
    `<li class="rg">${esc(REGIONS[r].name)}</li>` + claims[r].map(([m, c]) => { const M = MARKETS[m];
      return `<li><button class="mRow" data-a="claim" data-m="${m}" aria-label="Claim ${esc(M.name)} for ${c} silver">${gly(M)}<span class="mName"><b>${esc(M.name)}</b><span>${esc(M.product)}</span></span><span class="mCost"><b>${c}</b></span></button></li>`; }).join("")
  ).join("");
  const seizeRows = seizes.map(([m, c, o]) => { const M = MARKETS[m];
    return `<li><button class="mRow" data-a="seize" data-m="${m}" aria-label="Seize ${esc(M.name)} from ${esc(getP(S, o).name)} for ${c} silver">${gly(M)}<span class="mName"><b>${esc(M.name)}</b><span>${esc(M.product)}, held by ${esc(getP(S, o).name)}</span></span><span class="mCost"><b>${c}</b></span></button></li>`; }).join("");
  const techs = TECH_ORDER.filter(t => !p.techs.includes(t)).map(t => {
    const T = TECHS[t], c = techCost(S, A, t), ok = p.silver >= c;
    const navNote = NAV_SET.includes(t) ? " Part of the navigation set." : "";
    return `<li><button class="tRow" data-a="adopt" data-t="${t}" ${ok ? "" : "disabled"} aria-label="Adopt the ${esc(T.name)} for ${c} silver">
      <span class="mName"><b>${esc(T.name)}</b><span>${esc(T.text)}${navNote}</span><span class="origin">${esc(T.origin)}</span></span>
      <span class="mCost"><b>${c}</b></span></button></li>`;
  }).join("");
  return `${verdict}
    <h3 class="step">Make one move</h3>
    <p class="hint">Dashed rings on the map mark markets you can afford. Numbers are costs in silver.</p>
    <button class="btn ghost sm" data-a="hold">Hold reserves instead (+1 silver)</button>
    <div class="moveGroup"><h4>Claim an open market</h4>${claimRows ? `<ul class="mList grid">${claimRows}</ul>` : `<p class="empty">No open market is affordable yet.</p>`}</div>
    ${seizeRows ? `<div class="moveGroup"><h4>Seize a rival’s market</h4><ul class="mList">${seizeRows}</ul></div>` : ""}
    <div class="moveGroup"><h4>Adopt a technology</h4>${techs ? `<ul class="mList">${techs}</ul>` : `<p class="empty">You’ve adopted every technology.</p>`}</div>`;
}

function eventCard() {
  const E = EVENTS[S.event.id];
  const nextP = getP(S, S.order[0]);
  const canGo = net.kind === "local" || S.hostId === net.me || S.order[0] === net.me;
  return `<article class="card evCard">
    <p class="evRound">End of round ${S.event.round}: an event shapes the world</p>
    <h2>${esc(E.title)}</h2>
    <p class="evDate">${esc(E.date)}</p>
    <p class="evBlurb">${esc(E.blurb)}</p>
    <p class="evEffect"><b>Effect.</b> ${esc(E.effect)}</p>
    <ul class="evResults">${S.event.results.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${canGo ? `<button class="btn ink" data-a="continue">Begin round ${S.round + 1}</button>` : `<p class="waiting">Waiting for ${esc(nextP.name)} to begin round ${S.round + 1}.</p>`}
  </article>`;
}

function marketPanel(mid) {
  const M = MARKETS[mid], owner = S.markets[mid], op = owner ? getP(S, owner) : null;
  const A = activeId(S), mine = isMine() && S.phase === "action";
  let btn = "";
  if (mine) {
    const p = getP(S, A);
    if (!owner) { const c = claimCost(S, A, mid); btn = p.silver >= c ? `<button class="btn" data-a="claim" data-m="${mid}">Claim for ${c} silver</button>` : `<p class="hint">Claiming costs you ${c} silver. You have ${p.silver}.</p>`; }
    else if (owner === A) btn = `<p class="hint">You hold this market.</p>`;
    else if (S.capitals[mid]) btn = `<p class="hint">A capital can’t be seized.</p>`;
    else { const c = seizeCost(S, A, mid); btn = p.silver >= c ? `<button class="btn" data-a="seize" data-m="${mid}">Seize for ${c} silver</button>` : `<p class="hint">Seizing costs you ${c} silver. You have ${p.silver}.</p>`; }
  }
  return `<section class="mPanel" aria-label="${esc(M.name)} details">
    <div class="mpHead"><h3>${esc(M.name)}</h3><button class="btn link sm" data-a="closeSel" aria-label="Close market details">Close</button></div>
    <p class="mpSub">${esc(M.product)}, ${esc(GOODS[M.good].name.toLowerCase())}. ${esc(REGIONS[M.region].name)}. Base cost ${M.cost} silver.</p>
    <p class="mpOwner">${op ? `${chip(op, "sm")}Held by ${who(op)}${S.capitals[mid] ? ". Capital." : "."}` : "Open to claim."}</p>
    <p class="mpNote">${esc(M.note)}</p>
    ${btn}
  </section>`;
}

/* ---- Game over ---- */
function overView() {
  const st = standings(S), top = st[0].score;
  const winners = st.filter(x => x.score === top && x.silver === st[0].silver).map(x => getP(S, x.id));
  const title = winners.length > 1 ? `A tie between ${winners.map(w => esc(w.name)).join(" and ")}` : `${esc(winners[0].name)} wins`;
  const subtitle = winners.length > 1 ? `${top} prestige each.` : `${winners[0].name !== POWERS[winners[0].power].name ? esc(POWERS[winners[0].power].name) + ", " : ""}${top} prestige.`;
  const cols = ["markets", "regions", "goods", "techs", "knowledge", "bullion"];
  const heads = ["Markets", "Regions", "Goods", "Tech", "Answers", "Bullion"];
  const rows = st.map((x, i) => {
    const p = getP(S, x.id), sc = score(S, x.id);
    return `<tr${i === 0 ? ' class="win"' : ""}><td>${i + 1}</td><td><div class="who">${chip(p)}<span><b>${esc(p.name)}</b>${p.name !== POWERS[p.power].name ? `<span>${esc(POWERS[p.power].name)}</span>` : ""}</span></div></td>${cols.map(k => `<td>${sc.parts.find(z => z.key === k).n}</td>`).join("")}<td class="tot">${sc.total}</td></tr>`;
  }).join("");
  const reviewIds = net.kind === "online" ? [net.me] : S.order;
  if (!ui.reviewWho || !reviewIds.includes(ui.reviewWho)) ui.reviewWho = reviewIds[0];
  return `${topBar()}
  <main class="page over">
    <h1 class="pageTitle">${title}</h1>
    <p class="overSub">${subtitle}</p>
    <p class="hint">Final standings after ${S.round} round${S.round === 1 ? "" : "s"}. Ties go to the player with more silver.</p>
    <div class="tableWrap"><table class="final"><thead><tr><th>#</th><th>Player</th>${heads.map(h => `<th>${h}</th>`).join("")}<th>Prestige</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div id="mapSlot" class="mapFrame small"></div>
    <section class="review">
      <h2>Study review</h2>
      ${reviewIds.length > 1 ? `<div class="seg inline" role="group" aria-label="Choose a player">${reviewIds.map(id => `<button class="segBtn${ui.reviewWho === id ? " on" : ""}" data-a="reviewWho" data-id="${esc(id)}" aria-pressed="${ui.reviewWho === id}">${esc(getP(S, id).name)}</button>`).join("")}</div>` : ""}
      ${reviewFor(ui.reviewWho)}
    </section>
    <div class="actions"><button class="btn" data-a="home">Back to the start screen</button>${net.kind === "online" && S.hostId === net.me ? `<button class="btn ghost" data-a="closeRoom">Close this room</button>` : ""}</div>
  </main>`;
}
function reviewFor(id) {
  const p = getP(S, id); if (!p) return "";
  const hist = S.history.filter(h => h.id === id);
  if (!hist.length) return `<p class="empty">${esc(p.name)} didn’t answer any questions.</p>`;
  const byType = Object.keys(QTYPES).map(t => { const hs = hist.filter(h => Q_BY_ID[h.qid].t === t); return hs.length ? `<span><b>${hs.filter(h => h.ok).length}/${hs.length}</b> ${QTYPES[t].name}</span>` : ""; }).join("");
  const topicMiss = {};
  hist.forEach(h => { const tp = Q_BY_ID[h.qid].topic; topicMiss[tp] = topicMiss[tp] || [0, 0]; topicMiss[tp][1]++; if (h.ok) topicMiss[tp][0]++; });
  const weak = Object.keys(topicMiss).filter(k => topicMiss[k][0] < topicMiss[k][1]).sort((a, b) => (topicMiss[a][0] / topicMiss[a][1]) - (topicMiss[b][0] / topicMiss[b][1]));
  const missed = hist.filter(h => !h.ok).map(h => {
    const q = Q_BY_ID[h.qid];
    return `<li class="card rv"><p class="qMeta"><span>${QTYPES[q.t].name}</span><span>${esc(TOPICS[q.topic])}</span></p>
      ${q.s ? `<p class="rvStim">${esc(q.s)}</p>` : ""}<p class="qText">${esc(q.q)}</p>
      <p class="rvA"><b>Answer:</b> ${esc(q.o[0])}</p>${h.choice != null && h.choice !== 0 ? `<p class="rvYou"><b>Chosen:</b> ${esc(q.o[h.choice])}</p>` : ""}
      <p class="why">${esc(q.why)}</p></li>`;
  }).join("");
  return `<div class="acc">${byType}</div>
    ${weak.length ? `<p class="hint">Topics to review: ${weak.map(k => esc(TOPICS[k])).join("; ")}.</p>` : `<p class="hint">Every answer was correct. Nice work.</p>`}
    ${missed ? `<ul class="rvList">${missed}</ul>` : ""}`;
}

/* ---- Modals ---- */
function renderModal() {
  let el = $("#modal");
  if (!ui.modal) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "modal"; document.body.appendChild(el); }
  let inner = "";
  if (ui.modal === "rules") inner = rulesHTML();
  if (ui.modal === "menu") inner = menuHTML();
  el.innerHTML = `<div class="scrim" data-a="closeModal"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${inner}</div>`;
  const first = el.querySelector("button, [href]");
  if (first && !el.contains(document.activeElement)) first.focus();
}
function rulesHTML() {
  return `<div class="sheetHead"><h2 id="sheetTitle">How to play</h2><button class="btn link sm" data-a="closeModal">Close</button></div>
  <div class="rules">
    <p>You lead a power between 1450 and 1750. Earn silver by answering questions about Unit 4, then spend it to build a trading empire. After the last round, the player with the most prestige wins.</p>
    <h3>Your turn</h3>
    <ol>
      <li><b>Collect revenue.</b> 2 silver, plus 1 for each market you hold, plus any bonuses from your power or technologies.</li>
      <li><b>Answer a question.</b> Choose Recall (2 silver), Source (3 silver), or Reasoning (4 silver). A correct answer pays the silver and adds 1 prestige. Everyone sees the explanation.</li>
      <li><b>Make one move.</b> Claim an open market, seize a rival’s market (its cost plus 3), adopt a technology, or hold reserves for 1 silver. Capitals can’t be seized.</li>
    </ol>
    <p>After every player has gone, a historical event affects the whole table.</p>
    <h3>Prestige</h3>
    <ul>
      <li>2 for each market you hold</li>
      <li>2 for each region you reach beyond your first (Atlantic Africa, the Americas, the Indian Ocean, East and Southeast Asia)</li>
      <li>1 for each different kind of good you hold</li>
      <li>1 for each technology, plus 2 for the full navigation set: compass, astrolabe, and lateen sail</li>
      <li>1 for each correct answer</li>
      <li>1 for every 5 silver left at the end</li>
    </ul>
    <h3>Powers</h3>
    ${powerRef()}
    <h3>A note on content</h3>
    <p>Enslaved people are never a resource in this game. The slave trade and forced labor appear in events and questions so you can study their causes, their consequences, and the people who resisted them.</p>
  </div>`;
}
function menuHTML() {
  const host = S && (S.mode === "local" || S.hostId === (net && net.me));
  const playing = S && S.status === "playing";
  return `<div class="sheetHead"><h2 id="sheetTitle">Menu</h2><button class="btn link sm" data-a="closeModal">Close</button></div>
  <div class="menuList">
    ${playing && host ? `<button class="btn ghost wide" data-a="endGame">End the game now and score it</button>` : ""}
    ${S && S.mode === "local" ? `<button class="btn ghost wide" data-a="home">Exit to the start screen</button><p class="hint">This game stays saved on this device, so you can resume it.</p>`
      : `<button class="btn ghost wide" data-a="leave">Leave this room</button><p class="hint">${playing ? "The game keeps going without you. You can rejoin with the room code." : ""}</p>`}
  </div>`;
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const a = b.getAttribute("data-a");
  switch (a) {
    case "rules": ui.modal = "rules"; renderModal(); return;
    case "menu": ui.modal = "menu"; renderModal(); return;
    case "closeModal": ui.modal = null; renderModal(); return;
    case "home": ui.modal = null; goHome(); return;
    case "localSetup": ui.screen = "localSetup"; render(); return;
    case "resumeLocal": { const s = savedLocal(); if (s) startLocalSession(s); return; }
    case "lcount": ui.local.count = +b.dataset.n; fixLocalPowers(); render(); return;
    case "lrounds": ui.local.rounds = +b.dataset.n; render(); return;
    case "localStart": return localStart();
    case "create": case "join": case "rejoin": return onlineEntry(a);
    case "copyCode": try { await navigator.clipboard.writeText(S.code); toast("Room code copied."); } catch (err) { toast(`The room code is ${S.code}.`); } return;
    case "pick": { const me = getP(S, net.me); return act({ type: "pickPower", power: me && me.power === b.dataset.p ? null : b.dataset.p }); }
    case "rounds": return act({ type: "setRounds", rounds: +b.dataset.n });
    case "start": return act({ type: "start" });
    case "chooseQ": ui.sel = null; return act({ type: "chooseQ", qtype: b.dataset.t });
    case "answer": return act({ type: "answer", choice: +b.dataset.c });
    case "guess": ui.guess = { key: S.cur.key, choice: +b.dataset.c }; render(); return;
    case "toAction": return act({ type: "toAction" });
    case "claim": case "seize": ui.sel = null; return act({ type: a, market: b.dataset.m });
    case "adopt": return act({ type: "adopt", tech: b.dataset.t });
    case "hold": return act({ type: "hold" });
    case "skip": if (confirm("Skip this player’s turn?")) return act({ type: "skip" }); return;
    case "continue": return act({ type: "continue" });
    case "endGame": ui.modal = null; if (confirm("End the game now? Scores are final.")) return act({ type: "endGame" }); renderModal(); return;
    case "closeSel": ui.sel = null; render(); return;
    case "reviewWho": ui.reviewWho = b.dataset.id; render(); return;
    case "leave":
      ui.modal = null;
      if (S && S.status === "lobby") { try { await net.dispatch({ type: "leave" }); } catch (err) {} }
      goHome(); return;
    case "closeRoom":
      if (!confirm("Close this room? Everyone’s game data will be deleted.")) return;
      try { const ref = FB.ref; disconnect(true); await ref.remove(); } catch (err) { toast(friendlyError(err)); }
      S = null; net = null; ui.screen = "home"; render(); return;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-lp]")) ui.local.players[+t.dataset.lp].name = t.value;
  if (t.id === "code") t.value = t.value.toUpperCase().replace(/[^A-Z]/g, "");
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-lpow]")) { ui.local.players[+t.dataset.lpow].power = t.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.modal) { ui.modal = null; renderModal(); }
  if (e.key === "Enter" && e.target.id === "code") onlineEntry("join");
});

function fixLocalPowers() {
  const used = new Set();
  ui.local.players.forEach(p => {
    if (used.has(p.power)) p.power = POWER_ORDER.find(k => !used.has(k));
    used.add(p.power);
  });
}
function localStart() {
  const L = ui.local, ps = L.players.slice(0, L.count);
  if (new Set(ps.map(p => p.power)).size !== ps.length) { toast("Each player needs a different power."); return; }
  let st = newGame({ mode: "local", code: "", hostId: "p1", seed: (Math.random() * 2147483647) | 0 });
  ps.forEach((p, i) => {
    const id = "p" + (i + 1);
    st = reduce(st, { type: "join", name: p.name.trim() || POWERS[p.power].name }, id);
    st = reduce(st, { type: "pickPower", power: p.power, player: id }, id);
  });
  st = reduce(st, { type: "setRounds", rounds: L.rounds }, "p1");
  st = reduce(st, { type: "start" }, "p1");
  startLocalSession(st);
}
async function onlineEntry(kind) {
  if (!ONLINE_READY || ui.busy) return;
  const nickEl = $("#nick"), name = (nickEl ? nickEl.value : store.get("tw.nick") || "").trim();
  if (!name) { toast("Enter a nickname first."); if (nickEl) nickEl.focus(); return; }
  store.set("tw.nick", name);
  let code = kind === "rejoin" ? store.get("tw.lastCode") : ($("#code") ? $("#code").value.trim().toUpperCase() : "");
  if (kind !== "create" && !/^[A-Z]{4}$/.test(code)) { toast("Room codes are 4 letters."); return; }
  ui.busy = true;
  const btn = $(`[data-a="${kind}"]`); if (btn) { btn.disabled = true; btn.textContent = "Connecting…"; }
  try {
    if (kind === "create") await createOnline(name);
    else await joinOnline(code, name);
  } catch (e) {
    toast(friendlyError(e));
    if (kind === "rejoin" && /no game/i.test(e.message || "")) store.del("tw.lastCode");
    disconnect(false); S = null; net = null; ui.screen = "home"; render();
  } finally { ui.busy = false; }
}

/* ---------------- BOOT ---------------- */
render();

</script>
</body>
</html>
